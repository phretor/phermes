[package]
name = "phermesd"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Thin VM orchestrator for PHermes (replaces Proxmox VE)"

[[bin]]
name = "phermesd"
path = "src/bin/phermesd.rs"

[[bin]]
name = "phermesctl"
path = "src/bin/phermesctl/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
nix = { version = "0.31.3", features = ["signal", "process", "term"] }
qapi = { version = "0.15.0", features = ["async-tokio-all", "qmp", "qga"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "io-util", "io-std"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
